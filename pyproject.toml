[project]
name = "data-skills-lab"
version = "0.1.0"
description = "Graded SQL, Pandas and NumPy exercises on seeded synthetic market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
lab = "lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".corrections"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
